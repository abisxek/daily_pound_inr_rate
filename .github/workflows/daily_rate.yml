name: GBP→INR Daily Rate Email

on:
  schedule:
    # 12:00 PM BST = 11:00 AM UTC (BST is UTC+1)
    # In winter (GMT), 12:00 PM = 12:00 UTC — adjust if needed
    - cron: '0 11 * * *'
  workflow_dispatch:   # lets you trigger manually from GitHub for testing

jobs:
  send-rate-email:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo (needed to read/write last_rate.json)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Install dependencies
      - name: Install dependencies
        run: pip install requests

      # 4. Run the mailer script
      - name: Run GBP→INR mailer
        env:
          SENDER_EMAIL:   ${{ secrets.SENDER_EMAIL }}
          SENDER_PASS:    ${{ secrets.SENDER_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python rate_mailer.py

      # 5. Commit the updated last_rate.json back to the repo
      #    so tomorrow's run has today's rate to compare against
      - name: Save updated rate file
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_rate.json
          git diff --staged --quiet || git commit -m "chore: update GBP/INR rate $(date +'%Y-%m-%d')"
          git push
